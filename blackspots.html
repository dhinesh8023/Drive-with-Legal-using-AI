<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blackspots — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">AI Blackspot Prediction</h2>
  <p class="text-secondary" style="margin-top:-10px;">Predictions are AI-assisted risk estimates derived from near-misses, hazard reports, and violation density — never an official government designation.</p>

  <div class="glass-card" id="recalcSection" style="display:none; margin-bottom:16px;">
    <h3 class="mt-0" style="font-size:14px;">Calculate / Refresh a Blackspot Estimate</h3>
    <form id="recalcForm" class="grid grid-cols-4" style="align-items:end;">
      <div class="form-group mb-0"><label class="form-label">Latitude</label><input class="form-control" name="latitude" required></div>
      <div class="form-group mb-0"><label class="form-label">Longitude</label><input class="form-control" name="longitude" required></div>
      <div class="form-group mb-0"><label class="form-label">Road Name</label><input class="form-control" name="roadName"></div>
      <div class="form-group mb-0"><label class="form-label">District</label><input class="form-control" name="district"></div>
      <div class="form-group mb-0"><label class="form-label">Historical Accidents</label><input class="form-control" type="number" name="historicalAccidentCount" value="0"></div>
      <button type="submit" class="btn btn-primary">Calculate</button>
    </form>
  </div>

  <div id="blackspotsList"><div class="empty-state">Loading...</div></div>
</main>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/blackspots.js"></script>
</body>
</html>
