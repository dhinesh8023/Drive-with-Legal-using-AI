<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report Hazard — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Report a Road Hazard</h2>

  <div class="grid grid-cols-2" style="align-items:start;">
    <div class="glass-card">
      <form id="hazardForm">
        <div class="form-group">
          <label class="form-label">Hazard Type</label>
          <select class="form-control" name="hazardType" required>
            <option value="POTHOLE">Pothole</option>
            <option value="ACCIDENT">Accident</option>
            <option value="ROAD_DAMAGE">Road Damage</option>
            <option value="FLOODING">Flooding</option>
            <option value="CONSTRUCTION">Construction</option>
            <option value="OBSTACLE">Obstacle</option>
            <option value="DANGEROUS_CURVE">Dangerous Curve</option>
            <option value="POOR_VISIBILITY">Poor Visibility</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Severity</label>
          <select class="form-control" name="severity">
            <option value="LOW">Low</option>
            <option value="MODERATE" selected>Moderate</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="2"></textarea></div>
        <div class="form-group"><label class="form-label">Address (optional)</label><input class="form-control" name="address"></div>
        <div class="grid grid-cols-2">
          <div class="form-group"><label class="form-label">Latitude</label><input class="form-control" name="latitude" required></div>
          <div class="form-group"><label class="form-label">Longitude</label><input class="form-control" name="longitude" required></div>
        </div>
        <button type="button" class="btn btn-outline btn-sm mb-16" id="useLocationBtn"><i class="bi bi-geo-alt"></i> Use My Location</button>
        <button type="submit" class="btn btn-primary" style="width:100%;">Submit Report</button>
      </form>
    </div>

    <div class="glass-card">
      <h3 class="mt-0" style="font-size:14px;">Recent Reports</h3>
      <table class="data-table">
        <thead><tr><th>Type</th><th>Severity</th><th>Location</th><th>Confidence</th><th>Date</th></tr></thead>
        <tbody id="hazardsBody"><tr><td colspan="5" class="empty-state">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/hazards.js"></script>
</body>
</html>
