<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Route Safety Planner — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
<style>#routeMapContainer { height: 55vh; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); }</style>
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-0">Route Safety Planner</h2>
  <p class="text-secondary" style="margin-top:4px;">Prototype mode: click the map to set a start point, then a destination. Comparisons use demo road data — ready for a real mapping/directions API in production.</p>

  <div class="grid" style="grid-template-columns: 2fr 1fr; gap:18px; align-items:start;">
    <div class="glass-card" style="padding:0; overflow:hidden;">
      <div id="routeMapContainer"></div>
    </div>
    <div>
      <div class="glass-card" style="margin-bottom:14px;">
        <div style="font-size:12.5px;" class="mb-16">
          <div class="flex justify-between"><span class="text-muted">Start</span><span id="startLabel">Click map</span></div>
          <div class="flex justify-between" style="margin-top:6px;"><span class="text-muted">Destination</span><span id="endLabel">Click map</span></div>
        </div>
        <button class="btn btn-primary" style="width:100%;" id="calcRouteBtn">Compare Routes</button>
      </div>
      <div id="routeResults"></div>
    </div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/route-planner.js"></script>
</body>
</html>
