<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Violations — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Violations</h2>
  <p class="text-secondary" style="margin-top:-10px;">All entries are AI-assisted candidates. A fine is only ever created after officer approval.</p>

  <div class="glass-card">
    <table class="data-table">
      <thead><tr><th>Vehicle</th><th>Type</th><th>Date/Time</th><th>AI Confidence</th><th>Status</th><th>Location</th><th></th></tr></thead>
      <tbody id="violationsBody"><tr><td colspan="7" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-backdrop" id="reviewModal" style="display:none;">
  <div class="glass-card modal-box">
    <h3 class="mt-0">Officer Review</h3>
    <div class="form-group">
      <label class="form-label">Officer Notes</label>
      <textarea class="form-control" id="officerNotes" rows="3" placeholder="Add review notes..."></textarea>
    </div>
    <div class="flex gap-8 justify-between">
      <button class="btn btn-ghost" onclick="closeReview()">Cancel</button>
      <div class="flex gap-8">
        <button class="btn btn-outline" onclick="submitReview('MORE_REVIEW_REQUIRED')">Request More Review</button>
        <button class="btn btn-danger" onclick="submitReview('REJECTED')">Reject</button>
        <button class="btn btn-primary" onclick="submitReview('APPROVED')">Approve</button>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/violations.js"></script>
</body>
</html>
