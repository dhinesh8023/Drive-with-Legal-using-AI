<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FASTag — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">FASTag <span class="pill pill-review">DEMO MODE</span></h2>
  <p class="text-secondary" style="margin-top:-10px;">Simulated FASTag wallet for this prototype — not connected to any real bank or NHAI system.</p>

  <div id="fastagAccountsList"></div>

  <div class="glass-card" style="margin-top:8px;">
    <h3 class="mt-0" style="font-size:14px;">Link a FASTag to a Vehicle</h3>
    <form id="linkFastagForm" class="grid grid-cols-3" style="align-items:end;">
      <div class="form-group mb-0">
        <label class="form-label">Vehicle</label>
        <select class="form-control" name="vehicleId" required></select>
      </div>
      <div class="form-group mb-0">
        <label class="form-label">FASTag ID (optional)</label>
        <input class="form-control" name="fastagId" placeholder="Auto-generated if blank">
      </div>
      <button type="submit" class="btn btn-primary">Link FASTag</button>
    </form>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/fastag.js"></script>
</body>
</html>
