<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Police Dashboard — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Police Officer Dashboard</h2>

  <div class="grid grid-cols-4 mb-16">
    <div class="glass-card accented stat-card"><span class="label">Total Violations</span><span class="value" id="statTotalViolations">--</span></div>
    <div class="glass-card stat-card"><span class="label">Pending Review</span><span class="value text-moderate" id="statPendingReview">--</span></div>
    <div class="glass-card stat-card"><span class="label">Total Fines</span><span class="value" id="statTotalFines">--</span></div>
    <div class="glass-card stat-card"><span class="label">Paid Fines</span><span class="value text-safe" id="statPaidFines">--</span></div>
  </div>
  <div class="grid grid-cols-4 mb-24">
    <div class="glass-card stat-card"><span class="label">Pending Fines</span><span class="value text-moderate" id="statPendingFines">--</span></div>
    <div class="glass-card stat-card"><span class="label">Overdue Fines</span><span class="value text-critical" id="statOverdueFines">--</span></div>
    <a href="violations.html" class="glass-card stat-card quick-action"><span class="label">Review Queue</span><span class="value" style="font-size:16px;">Open →</span></a>
    <a href="road-map.html" class="glass-card stat-card quick-action"><span class="label">Road Safety Map</span><span class="value" style="font-size:16px;">Open →</span></a>
  </div>

  <div class="glass-card">
    <div class="flex justify-between items-center mb-16">
      <h3 class="mt-0 mb-0">Pending Review Queue</h3>
      <a href="violations.html" class="text-secondary" style="font-size:13px;">View all →</a>
    </div>
    <table class="data-table">
      <thead><tr><th>Vehicle</th><th>Type</th><th>AI Confidence</th><th>Date</th><th></th></tr></thead>
      <tbody id="pendingQueueBody"><tr><td colspan="5" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/police.js"></script>
</body>
</html>
