<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Government Dashboard — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Government Dashboard</h2>

  <div class="grid grid-cols-4 mb-24">
    <div class="glass-card accented stat-card"><span class="label">Total Violations</span><span class="value" id="statTotalViolations">--</span></div>
    <div class="glass-card stat-card"><span class="label">Total Fines Generated</span><span class="value" id="statTotalFines">--</span></div>
    <div class="glass-card stat-card"><span class="label">Total Collection</span><span class="value text-safe" id="statCollection">--</span></div>
    <div class="glass-card stat-card"><span class="label">Pending Collection</span><span class="value text-moderate" id="statPendingCollection">--</span></div>
  </div>

  <div class="grid grid-cols-2 gap-16">
    <div class="glass-card">
      <div class="flex justify-between items-center mb-16">
        <h3 class="mt-0 mb-0" style="font-size:14px;">AI-Predicted Blackspots (Top 5)</h3>
        <a href="blackspots.html" class="text-secondary" style="font-size:12px;">View all →</a>
      </div>
      <div id="topBlackspots"><div class="empty-state">Loading...</div></div>
    </div>
    <div class="glass-card">
      <h3 class="mt-0" style="font-size:14px;">Overdue Fines</h3>
      <div class="stat-card">
        <span class="value text-critical" id="statOverdueFines" style="font-size:38px;">--</span>
        <span class="sub">require follow-up notifications</span>
      </div>
      <a href="fine-management.html" class="btn btn-outline btn-sm" style="margin-top:12px;">Go to Fine Management →</a>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-16" style="margin-top:16px;">
    <a href="analytics.html" class="glass-card stat-card quick-action"><span class="label">Full Analytics</span><span class="value" style="font-size:16px;">Open →</span></a>
    <a href="road-map.html" class="glass-card stat-card quick-action"><span class="label">Road Safety Map</span><span class="value" style="font-size:16px;">Open →</span></a>
    <a href="fleet.html" class="glass-card stat-card quick-action"><span class="label">Fleet Overview</span><span class="value" style="font-size:16px;">Open →</span></a>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/government.js"></script>
</body>
</html>
