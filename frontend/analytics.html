<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Road Safety Analytics</h2>

  <div class="grid grid-cols-4 mb-24">
    <div class="glass-card stat-card"><span class="label">Total Violations</span><span class="value" id="statViolations">--</span></div>
    <div class="glass-card stat-card"><span class="label">Pending Review</span><span class="value text-moderate" id="statPendingReview">--</span></div>
    <div class="glass-card stat-card"><span class="label">Total Collection</span><span class="value text-safe" id="statCollection">--</span></div>
    <div class="glass-card stat-card"><span class="label">Pending Collection</span><span class="value text-high" id="statPendingCollection">--</span></div>
  </div>

  <div class="grid grid-cols-2 gap-16 mb-24">
    <div class="glass-card"><h3 class="mt-0" style="font-size:14px;">Violations by Type</h3><canvas id="violationTypeChart"></canvas></div>
    <div class="glass-card"><h3 class="mt-0" style="font-size:14px;">Violations by District</h3><canvas id="violationDistrictChart"></canvas></div>
  </div>

  <div class="grid grid-cols-2 gap-16 mb-24">
    <div class="glass-card"><h3 class="mt-0" style="font-size:14px;">Fine Collection by Payment Method</h3><canvas id="paymentMethodChart"></canvas></div>
    <div class="glass-card"><h3 class="mt-0" style="font-size:14px;">Fine Collection Trend</h3><canvas id="collectionTrendChart"></canvas></div>
  </div>

  <div class="glass-card">
    <h3 class="mt-0" style="font-size:14px;">Near-Miss Trend</h3>
    <canvas id="nearMissTrendChart"></canvas>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
