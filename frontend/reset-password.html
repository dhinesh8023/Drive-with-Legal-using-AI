<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="glass-card accented auth-card">
    <div class="auth-logo">
      <div class="emoji">🔒</div>
      <h1>Reset Password</h1>
      <p>Enter your new password below</p>
    </div>
    <form id="resetForm">
      <div class="form-group">
        <label class="form-label">Reset Token</label>
        <input type="text" id="token" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" id="newPassword" class="form-control" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Reset Password</button>
    </form>
    <div style="text-align:center; margin-top:16px; font-size:12.5px;">
      <a href="login.html">Back to login</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get("token")) document.getElementById("token").value = params.get("token");

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = document.getElementById("token").value.trim();
  const newPassword = document.getElementById("newPassword").value;
  try {
    await api.post("/auth/reset-password", { token, newPassword }, { skipAuth: true });
    showToast("Password reset successfully. Please log in.", "success");
    setTimeout(() => (location.href = "login.html"), 1000);
  } catch (err) {
    showToast(err.message, "error");
  }
});
</script>
</body>
</html>
