<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="glass-card accented auth-card">
    <div class="auth-logo">
      <div class="emoji">🔑</div>
      <h1>Forgot Password</h1>
      <p>We'll generate a reset link for your account</p>
    </div>
    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Link</button>
    </form>
    <div id="demoTokenBox" style="display:none; margin-top:16px; font-size:11.5px; color:var(--text-muted);" class="glass-card"></div>
    <div style="text-align:center; margin-top:16px; font-size:12.5px;">
      <a href="login.html">Back to login</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  try {
    const data = await api.post("/auth/forgot-password", { email }, { skipAuth: true });
    showToast("If an account exists, a reset link has been generated.", "success");
    if (data.demoResetToken) {
      const box = document.getElementById("demoTokenBox");
      box.style.display = "block";
      box.innerHTML = `<strong>Demo mode:</strong> reset token (would normally be emailed):<br><code>${data.demoResetToken}</code><br><a href="reset-password.html?token=${data.demoResetToken}">Continue to reset password →</a>`;
    }
  } catch (err) {
    showToast(err.message, "error");
  }
});
</script>
</body>
</html>
