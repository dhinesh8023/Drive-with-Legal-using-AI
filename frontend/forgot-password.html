<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Drive Legal AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <i class="bi bi-key-fill"></i>
        <h2>Reset Credentials</h2>
        <p>Recover access to your Drive Legal AI Account</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label">Registered Email</label>
          <div class="input-with-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" id="forgot-email" class="dl-input" placeholder="user@drivelegal.demo" required>
          </div>
        </div>

        <button type="submit" id="forgot-submit-btn" class="btn-dl btn-dl-primary w-100 py-3 mt-2">
          Generate Reset Token
        </button>
      </form>

      <!-- Token display for demo convenience -->
      <div id="reset-token-box" class="quick-demo-pill mt-3 d-none">
        <strong>Demo Reset Token Generated:</strong>
        <div class="mt-1"><code id="demo-token-display"></code></div>
        <hr class="border-secondary my-2">
        <form id="reset-form" class="mt-2">
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" id="new-password" class="dl-input" placeholder="NewPassword123!" required>
          </div>
          <button type="submit" class="btn-dl btn-dl-primary w-100 py-2">Apply New Password</button>
        </form>
      </div>

      <div class="text-center mt-4 text-muted small">
        Remembered password? <a href="login.html" class="fw-bold">Return to Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let activeResetToken = '';

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value;
      const res = await API.post('/auth/forgot-password', { email });

      if (res.success && res.data) {
        activeResetToken = res.data.resetToken;
        document.getElementById('demo-token-display').textContent = activeResetToken;
        document.getElementById('reset-token-box').classList.remove('d-none');
        Utils.showToast('success', 'Token Generated', 'Use the demo reset token to update your password.');
      } else {
        Utils.showToast('danger', 'Error', res.message);
      }
    });

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const res = await API.post('/auth/reset-password', {
        token: activeResetToken,
        newPassword,
      });

      if (res.success) {
        Utils.showToast('success', 'Password Updated', 'You can now log in with your new password.');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } else {
        Utils.showToast('danger', 'Update Failed', res.message);
      }
    });
  </script>
</body>
</html>
