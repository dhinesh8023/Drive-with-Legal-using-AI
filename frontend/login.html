<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Drive Legal AI Command Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <i class="bi bi-shield-shaded"></i>
        <h2>DRIVE LEGAL AI</h2>
        <p>Predictive Road Safety Command Platform</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button type="button" class="role-tab-btn active" data-role="USER">Public</button>
        <button type="button" class="role-tab-btn" data-role="POLICE">Police</button>
        <button type="button" class="role-tab-btn" data-role="GOVERNMENT_STAFF">Govt</button>
        <button type="button" class="role-tab-btn" data-role="ADMIN">Admin</button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Authorized Email Address</label>
          <div class="input-with-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" id="login-email" class="dl-input" placeholder="name@drivelegal.demo" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Security Password</label>
          <div class="input-with-icon">
            <i class="bi bi-lock"></i>
            <input type="password" id="login-password" class="dl-input" placeholder="••••••••••••" required>
          </div>
        </div>

        <div class="auth-actions">
          <label class="d-flex align-items-center gap-2 text-muted" style="cursor: pointer;">
            <input type="checkbox" id="remember-me" checked> Remember Device
          </label>
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit" id="login-submit-btn" class="btn-dl btn-dl-primary w-100 py-3">
          <i class="bi bi-box-arrow-in-right"></i> Authenticate & Enter Portal
        </button>
      </form>

      <!-- Quick Access Credentials for Project Viva / Evaluation -->
      <div class="quick-demo-pill">
        <div class="d-flex justify-content-between align-items-center">
          <div><i class="bi bi-key-fill text-cyan"></i> <strong>Project Review Quick Access:</strong></div>
          <button type="button" class="demo-fill-btn" id="demo-fill-btn">Auto-Fill Credentials</button>
        </div>
        <div class="mt-1" id="demo-credentials-text">
          User: <code>user@drivelegal.demo</code> (Password: <code>DemoPassword123!</code>)
        </div>
      </div>

      <div class="text-center mt-4 text-muted small">
        New commuter? <a href="register.html" class="fw-bold">Register Vehicle Profile</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let activeRole = 'USER';

    document.addEventListener('DOMContentLoaded', () => {
      // Check pre-selected role
      const savedRole = localStorage.getItem('dl_demo_role');
      if (savedRole) {
        selectRole(savedRole);
        localStorage.removeItem('dl_demo_role');
      } else {
        selectRole('USER');
      }

      // Role tabs
      document.querySelectorAll('.role-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectRole(btn.dataset.role);
        });
      });

      // Demo fill
      document.getElementById('demo-fill-btn').addEventListener('click', () => {
        Auth.fillDemoCredentials(activeRole);
      });

      // Login form submit
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-submit-btn');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Authenticating...';

        const res = await Auth.login(email, password, activeRole);
        if (res.success && res.data) {
          Utils.showToast('success', 'Authentication Successful', `Welcome back, ${res.data.user.name}`);
          setTimeout(() => {
            const redirectUrl = CONFIG.ROLE_REDIRECTS[res.data.user.role] || 'dashboard.html';
            window.location.href = redirectUrl;
          }, 800);
        } else {
          Utils.showToast('danger', 'Login Failed', res.message || 'Invalid credentials');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Authenticate & Enter Portal';
        }
      });
    });

    function selectRole(role) {
      activeRole = role;
      document.querySelectorAll('.role-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.role === role);
      });

      const credMap = {
        USER: 'user@drivelegal.demo',
        POLICE: 'police@drivelegal.demo',
        GOVERNMENT_STAFF: 'gov@drivelegal.demo',
        ADMIN: 'admin@drivelegal.demo'
      };

      document.getElementById('demo-credentials-text').innerHTML = 
        `${role}: <code>${credMap[role]}</code> (Password: <code>DemoPassword123!</code>)`;

      // Auto-populate for easiest demonstration experience
      Auth.fillDemoCredentials(role);
    }
  </script>
</body>
</html>
