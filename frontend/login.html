<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="glass-card accented auth-card">
    <div class="auth-logo">
      <div class="emoji">🚗</div>
      <h1>DRIVE LEGAL AI</h1>
      <p>Sign in to your road safety command platform</p>
    </div>

    <div class="role-tabs">
      <div class="role-tab active" data-role="USER">Public / User</div>
      <div class="role-tab" data-role="POLICE">Police</div>
      <div class="role-tab" data-role="GOVERNMENT_STAFF">Gov Staff</div>
      <div class="role-tab" data-role="ADMIN">Admin</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>

    <div style="text-align:center; margin-top:16px; font-size:12.5px;">
      <a href="forgot-password.html">Forgot password?</a> &nbsp;|&nbsp;
      <a href="register.html">Create account</a>
    </div>

    <div class="glass-card" style="margin-top:18px; padding:12px 14px; font-size:11.5px; color:var(--text-muted);">
      <strong>Demo accounts</strong> (development only):<br>
      user@drivelegal.demo · police@drivelegal.demo · gov@drivelegal.demo · admin@drivelegal.demo<br>
      Password: <code>DemoPassword123!</code>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
