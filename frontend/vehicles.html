<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Vehicles — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <div class="flex justify-between items-center mb-16">
    <h2 class="mt-0 mb-0">My Vehicles</h2>
    <button class="btn btn-primary btn-sm" onclick="openAddVehicleModal()"><i class="bi bi-plus-lg"></i> Add Vehicle</button>
  </div>

  <div class="glass-card">
    <table class="data-table">
      <thead><tr><th>Vehicle Number</th><th>Type</th><th>Brand / Model</th><th>Year</th><th>FASTag ID</th><th></th></tr></thead>
      <tbody id="vehiclesBody"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-backdrop" id="addVehicleModal" style="display:none;">
  <div class="glass-card modal-box">
    <h3 class="mt-0">Register Vehicle</h3>
    <form id="addVehicleForm">
      <div class="form-group"><label class="form-label">Vehicle Number</label><input class="form-control" name="vehicleNumber" placeholder="TN37AB1234" required></div>
      <div class="form-group">
        <label class="form-label">Vehicle Type</label>
        <select class="form-control" name="vehicleType" required>
          <option value="TWO_WHEELER">Two Wheeler</option>
          <option value="FOUR_WHEELER">Four Wheeler</option>
          <option value="COMMERCIAL">Commercial</option>
          <option value="HEAVY_VEHICLE">Heavy Vehicle</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="grid grid-cols-2">
        <div class="form-group"><label class="form-label">Brand</label><input class="form-control" name="brand"></div>
        <div class="form-group"><label class="form-label">Model</label><input class="form-control" name="model"></div>
      </div>
      <div class="grid grid-cols-2">
        <div class="form-group"><label class="form-label">Year</label><input class="form-control" type="number" name="year"></div>
        <div class="form-group"><label class="form-label">FASTag ID</label><input class="form-control" name="fastagId"></div>
      </div>
      <div class="flex gap-8 justify-between">
        <button type="button" class="btn btn-ghost" onclick="closeAddVehicleModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Vehicle</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/vehicles.js"></script>
</body>
</html>
