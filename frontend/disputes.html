<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Disputes — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Fine Disputes</h2>

  <div class="glass-card" id="newDisputeSection" style="display:none; margin-bottom:16px;">
    <h3 class="mt-0" style="font-size:14px;">Submit a Dispute</h3>
    <form id="newDisputeForm">
      <div class="form-group">
        <label class="form-label">Fine</label>
        <select class="form-control" name="fineId" required></select>
      </div>
      <div class="form-group"><label class="form-label">Reason</label><input class="form-control" name="reason" required></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
      <button type="submit" class="btn btn-primary">Submit Dispute</button>
    </form>
  </div>

  <div class="glass-card">
    <table class="data-table">
      <thead><tr><th>Fine</th><th>Reason</th><th>Submitted By</th><th>Status</th><th>Date</th><th></th></tr></thead>
      <tbody id="disputesBody"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-backdrop" id="disputeReviewModal" style="display:none;">
  <div class="glass-card modal-box">
    <h3 class="mt-0">Review Dispute</h3>
    <div class="form-group"><label class="form-label">Note</label><textarea class="form-control" id="disputeReviewNote" rows="3"></textarea></div>
    <div class="flex gap-8 justify-between">
      <button class="btn btn-ghost" onclick="closeReview()">Cancel</button>
      <div class="flex gap-8">
        <button class="btn btn-outline" onclick="submitDisputeReview('MORE_INFO_REQUESTED')">Request Info</button>
        <button class="btn btn-danger" onclick="submitDisputeReview('REJECTED')">Reject</button>
        <button class="btn btn-primary" onclick="submitDisputeReview('ACCEPTED')">Accept</button>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/disputes.js"></script>
</body>
</html>
