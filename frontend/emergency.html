<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emergency — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Emergency</h2>
  <div class="glass-card accented" style="text-align:center; padding:36px;">
    <i class="bi bi-life-preserver" style="font-size:44px; color: var(--critical);"></i>
    <p class="text-secondary" style="max-width:480px; margin:12px auto 20px;">
      This prototype never contacts a real emergency service automatically. Pressing SOS creates a
      simulated event and asks you to confirm your status — nothing is dispatched without your explicit action.
    </p>
    <button class="btn btn-danger" id="sosBtn" style="padding:14px 32px; font-size:15px;"><i class="bi bi-exclamation-octagon"></i> Trigger Manual SOS</button>
  </div>

  <div class="glass-card" id="sosConfirmPanel" style="display:none; margin-top:16px; text-align:center;">
    <h3 class="mt-0" style="font-size:14px;">Are you okay?</h3>
    <div class="flex gap-8" style="justify-content:center;">
      <button class="btn btn-outline" id="respondOkayBtn">I'm Okay — False Alarm</button>
      <button class="btn btn-danger" id="respondHelpBtn">I Need Help</button>
    </div>
  </div>

  <div class="glass-card" style="margin-top:16px;">
    <h3 class="mt-0" style="font-size:14px;">Emergency History</h3>
    <table class="data-table">
      <thead><tr><th>Trigger</th><th>Status</th><th>Created</th><th>Responded</th></tr></thead>
      <tbody id="emergencyBody"><tr><td colspan="4" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/emergency.js"></script>
</body>
</html>
