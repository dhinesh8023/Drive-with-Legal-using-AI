<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Road Safety Map — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
<style>#mapContainer { height: 70vh; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); }</style>
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <div class="flex justify-between items-center mb-16">
    <h2 class="mt-0 mb-0">Road Safety Map</h2>
    <div class="flex gap-16" style="font-size:13px;">
      <label><input type="checkbox" id="filterHazards" checked> Hazards</label>
      <label><input type="checkbox" id="filterBlackspots" checked> AI-Predicted Blackspots</label>
    </div>
  </div>
  <div class="glass-card" style="padding:0; overflow:hidden;">
    <div id="mapContainer"></div>
  </div>
  <p class="text-muted" style="font-size:11px; margin-top:10px;">🔴 High Risk &nbsp; 🟠 Moderate Risk &nbsp; 🟢 Low Risk. Blackspot shading is an AI-assisted risk estimate, not an official government designation.</p>
</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/map.js"></script>
</body>
</html>
