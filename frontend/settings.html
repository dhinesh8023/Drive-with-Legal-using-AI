<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Settings</h2>

  <div class="grid grid-cols-2 gap-16">
    <div class="glass-card">
      <h3 class="mt-0" style="font-size:14px;">Profile</h3>
      <form id="profileForm">
        <div class="form-group"><label class="form-label">Name</label><input class="form-control" id="profileName"></div>
        <div class="form-group"><label class="form-label">Email</label><input class="form-control" id="profileEmail" disabled></div>
        <div class="form-group"><label class="form-label">Phone</label><input class="form-control" id="profilePhone"></div>
        <div class="form-group"><label class="form-label">Address</label><input class="form-control" id="profileAddress"></div>
        <div class="form-group"><label class="form-label">License Number</label><input class="form-control" id="profileLicense"></div>
        <button type="submit" class="btn btn-primary">Save Profile</button>
      </form>
    </div>

    <div class="glass-card">
      <h3 class="mt-0" style="font-size:14px;">AI Voice Co-Driver Preferences</h3>
      <form id="voicePrefsForm">
        <div class="voice-settings-row">
          <span>Enable Voice Alerts</span>
          <label class="switch"><input type="checkbox" id="prefVoiceEnabled"><span class="slider"></span></label>
        </div>
        <div class="voice-settings-row">
          <span>Language</span>
          <select class="form-control" id="prefVoiceLang" style="width:auto; padding:4px 8px;">
            <option value="en">English</option>
            <option value="ta">Tamil (தமிழ்)</option>
          </select>
        </div>
        <div class="voice-settings-row">
          <span>Alert Frequency</span>
          <select class="form-control" id="prefVoiceFrequency" style="width:auto; padding:4px 8px;">
            <option value="low">Low</option>
            <option value="normal">Normal</option>
            <option value="high">High</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:14px;">Save Preferences</button>
      </form>
    </div>
  </div>
</main>
<link rel="stylesheet" href="css/live-drive.css">
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
