<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fine Management — Drive Legal AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="appShell"></div>
<main id="pageContent" style="display:none;">
  <h2 class="mt-0 mb-16">Fine Management</h2>

  <div class="glass-card" id="fineRulesSection" style="display:none; margin-bottom:16px;">
    <h3 class="mt-0" style="font-size:14px;">Configured Fine Rules (DEMO amounts — admin editable)</h3>
    <form id="fineRuleForm" class="grid grid-cols-4" style="align-items:end; margin-bottom:16px;">
      <div class="form-group mb-0">
        <label class="form-label">Violation Type</label>
        <select class="form-control" name="violationType" required>
          <option value="OVERSPEEDING">Overspeeding</option>
          <option value="WRONG_SIDE_DRIVING">Wrong Side Driving</option>
          <option value="RED_LIGHT_VIOLATION">Red Light Violation</option>
          <option value="ILLEGAL_PARKING">Illegal Parking</option>
          <option value="DANGEROUS_DRIVING">Dangerous Driving</option>
          <option value="LANE_VIOLATION">Lane Violation</option>
          <option value="HELMET_VIOLATION">Helmet Violation</option>
          <option value="SEATBELT_VIOLATION">Seatbelt Violation</option>
          <option value="MOBILE_PHONE_USAGE">Mobile Phone Usage</option>
          <option value="UNAUTHORIZED_ROAD_ENTRY">Unauthorized Road Entry</option>
          <option value="REPEATED_UNSAFE_DRIVING">Repeated Unsafe Driving</option>
        </select>
      </div>
      <div class="form-group mb-0"><label class="form-label">Base Amount (&#8377;)</label><input class="form-control" type="number" name="baseFineAmount" required></div>
      <div class="form-group mb-0"><label class="form-label">Due Period (days)</label><input class="form-control" type="number" name="duePeriodDays" value="15"></div>
      <button type="submit" class="btn btn-primary">Save Rule</button>
    </form>
    <table class="data-table">
      <thead><tr><th>Violation Type</th><th>Amount</th><th>Due Period</th><th>Status</th></tr></thead>
      <tbody id="fineRulesBody"></tbody>
    </table>
  </div>

  <div class="glass-card">
    <table class="data-table">
      <thead><tr><th>Fine ID</th><th>Violation</th><th>Amount</th><th>Due Date</th><th>Status</th><th></th></tr></thead>
      <tbody id="finesBody"><tr><td colspan="6" class="empty-state">Loading...</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-backdrop" id="payModal" style="display:none;">
  <div class="glass-card modal-box">
    <h3 class="mt-0">Choose Payment Method</h3>
    <input type="hidden" id="payFineId">
    <div class="grid grid-cols-2 gap-8 mb-16">
      <label class="glass-card" style="cursor:pointer;"><input type="radio" name="payMethod" value="UPI" checked> UPI</label>
      <label class="glass-card" style="cursor:pointer;"><input type="radio" name="payMethod" value="GOOGLE_PAY"> Google Pay</label>
      <label class="glass-card" style="cursor:pointer;"><input type="radio" name="payMethod" value="PHONEPE"> PhonePe</label>
      <label class="glass-card" style="cursor:pointer;"><input type="radio" name="payMethod" value="FASTAG"> FASTag</label>
    </div>
    <p class="text-muted" style="font-size:11px;">Demo payment mode — no real funds are transferred.</p>
    <div class="flex gap-8 justify-between">
      <button class="btn btn-ghost" onclick="closePayModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitPayment()">Pay Now</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/fines.js"></script>
</body>
</html>
